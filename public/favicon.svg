<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap');
      .logo-text {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 160px;
        letter-spacing: 1px;
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0D0D0E" rx="128" ry="128" />
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" rx="116" ry="116" />
  <text x="50%" y="54%" dominant-baseline="central" text-anchor="middle" class="logo-text" fill="url(#goldGrad)">Qibla</text>
</svg>